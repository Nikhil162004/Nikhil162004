name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report contribution calendar seen by the API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SNAKE_TOKEN || github.token }}
          script: |
            const result = await github.graphql(`
              query($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays { date contributionCount }
                      }
                    }
                  }
                }
              }
            `, { login: 'Nikhil162004' });
            const calendar = result.user.contributionsCollection.contributionCalendar;
            const days = calendar.weeks.flatMap(w => w.contributionDays);
            const activeDays = days.filter(d => d.contributionCount > 0).length;
            core.info(`Calendar contributions: ${calendar.totalContributions}`);
            core.info(`Active days: ${activeDays}`);
            core.info(`Calendar range: ${days[0]?.date} to ${days.at(-1)?.date}`);
            await core.summary
              .addHeading('Contribution calendar used for this snake')
              .addTable([
                [{data: 'Metric', header: true}, {data: 'Value', header: true}],
                ['Contributions visible to API', String(calendar.totalContributions)],
                ['Active days / initially coloured cells', String(activeDays)],
                ['Date range', `${days[0]?.date} to ${days.at(-1)?.date}`]
              ])
              .addRaw('The snake represents active days, not individual commits. A smaller API calendar is a data-visibility issue, not an animation-colour issue.')
              .write();

      - name: Generate snake images
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Nikhil162004
          github_token: ${{ secrets.SNAKE_TOKEN || github.token }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#0891B2&color_dots=#ebedf0,#a5b4fc,#818cf8,#6366f1,#0891B2
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#10B981&color_dots=#2d3343,#4b5563,#7C3AED,#A78BFA,#22D3EE

      - name: Publish snake images
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

